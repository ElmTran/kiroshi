[package]
name = "kiroshi"
version = "0.2.0"
description = "Kiroshi: a hotkey-summoned search box for keyboard shortcuts and commands"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "kiroshi_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-autostart = "2"

[target.'cfg(windows)'.dependencies]
# Same versions as Tauri's own (via wry), so the WebView2 types line up.
webview2-com = "0.39"
windows-core = "0.62"
